services:
  - type: web
    name: smartcanteen-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: https://smartcanteen-kijy.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://smartcanteen-kijy.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_DEFAULT_RESTAURANT
        value: starbucks
      - key: ENABLE_DEMO_SEEDING
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false

